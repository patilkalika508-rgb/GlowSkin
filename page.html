<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skincare Store</title>
<style>
  /* Reset & base styles */
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #faf8f7;
    margin: 0;
    padding: 0;
    color: #333;
  }

  /* Navigation */
  nav {
    background-color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  nav .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  nav .logo {
    font-weight: 700;
    font-size: 1.5em;
    color: #4a90e2;
  }
  nav ul {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
  }
  nav ul li a {
    text-decoration: none;
    color: #444;
    font-weight: 600;
    transition: color 0.3s;
  }
  nav ul li a:hover {
    color: #4a90e2;
  }

  /* Banner */
  .banner {
    background-image: url('https://t4.ftcdn.net/jpg/03/72/21/29/360_F_372212921_l0wtrUbGY168QTCIRHp1W02ug8CVuWSV.jpg');
    background-size: cover;
    background-position: center;
    height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-shadow: 0 0 5px rgba(0,0,0,0.7);
    font-size: 2.5em;
    font-weight: 700;
  }

  /* Main content */
  main {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px 50px;
  }

  /* Products grid */
  .products-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
  }

  .product {
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease;
  }
  .product:hover {
    transform: translateY(-8px);
  }

  .product img {
    width: 100%;
    height: 200px;
    object-fit: cover;
  }

  .product-details {
    padding: 15px 20px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .product-name {
    font-weight: 700;
    font-size: 1.1em;
    margin-bottom: 8px;
    color: #222;
  }

  .product-desc {
    font-size: 0.9em;
    color: #666;
    margin-bottom: 12px;
    flex-grow: 1;
  }

  .product-price {
    font-weight: 700;
    color: #4a90e2;
    font-size: 1.1em;
    margin-bottom: 12px;
  }

  .add-to-cart-btn {
    background-color: #4a90e2;
    border: none;
    color: white;
    padding: 10px 0;
    font-weight: 600;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  .add-to-cart-btn:hover {
    background-color: #357ABD;
  }

  /* Cart sidebar */
  #cartSidebar {
    position: fixed;
    top: 0;
    right: -350px;
    width: 350px;
    height: 100%;
    background: white;
    box-shadow: -4px 0 12px rgba(0,0,0,0.15);
    padding: 20px;
    transition: right 0.3s ease;
    overflow-y: auto;
    z-index: 150;
  }
  #cartSidebar.open {
    right: 0;
  }
  #cartSidebar h2 {
    margin-top: 0;
    font-size: 1.5em;
    border-bottom: 2px solid #4a90e2;
    padding-bottom: 10px;
  }
  #cartItems {
    margin: 20px 0;
  }
  .cart-item {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
  }
  .cart-item img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 6px;
  }
  .cart-item-details {
    flex-grow: 1;
  }
  .cart-item-name {
    font-weight: 700;
  }
  .cart-item-price {
    color: #4a90e2;
    font-weight: 600;
  }
  .cart-item-remove {
    color: #e74c3c;
    cursor: pointer;
    font-weight: 700;
    font-size: 1.2em;
  }
  #cartTotal {
    font-weight: 700;
    font-size: 1.2em;
    border-top: 2px solid #4a90e2;
    padding-top: 15px;
    text-align: right;
  }
  #closeCartBtn {
    background: none;
    border: none;
    font-size: 1.5em;
    color: #444;
    position: absolute;
    top: 15px;
    right: 15px;
    cursor: pointer;
  }

  /* Responsive */
  @media(max-width: 768px) {
    nav .nav-container {
      flex-direction: column;
      gap: 10px;
    }
    .banner {
      height: 180px;
      font-size: 1.8em;
    }
    #cartSidebar {
      width: 100%;
      right: -100%;
    }
    #cartSidebar.open {
      right: 0;
    }
  }

</style>
</head>
<body>

<nav>
  <div class="nav-container">
    <div class="logo">GlowSkin</div>
    <ul>
      <li><a href="#" id="homeLink">Home</a></li>
      <li><a href="#" id="aboutLink">About Us</a></li>
      <li><a href="#" id="cartLink">Cart (<span id="cartCount">0</span>)</a></li>
    </ul>
  </div>
</nav>

<div class="banner">
  Your Ultimate Skincare Destination
</div>

<main>
  <div class="products-container" id="productsContainer">
    <!-- Product cards inserted by JS -->
  </div>
</main>

<!-- Cart Sidebar -->
<div id="cartSidebar" aria-hidden="true">
  <button id="closeCartBtn" aria-label="Close Cart">&times;</button>
  <h2>Your Cart</h2>
  <div id="cartItems">
    <p>Your cart is empty.</p>
  </div>
  <div id="cartTotal"></div>
</div>

<script>
  // Product data (8 items)
  const products = [
    {
      id: 1,
      name: "Hydrating Face Cream",
      image: "https://anahataorganic.com/cdn/shop/files/nava-cream.jpg?v=1711188595&width=1946",
      desc: "Keeps your skin moisturized all day long.",
      price: 25.99
    },
    {
      id: 2,
      name: "Vitamin C Serum",
      image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ6iMwH9C6Hy1uQdPKmbqTa_dvn18aBPJssg&s",
      desc: "Brightens skin and boosts collagen production.",
      price: 34.50
    },
    {
      id: 3,
      name: "Sunscreen SPF 50",
      image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVQ5E-Osaof6FSHJSI9oycrTmRIEypi30kYw&s",
      desc: "Protects your skin from harmful UV rays.",
      price: 19.99
    },
    {
      id: 4,
      name: "Gentle Face Cleanser",
      image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGvpJwxMVgRSpWXqA-6gmkACDGWItu1uRRuQ&s",
      desc: "Removes dirt and impurities gently.",
      price: 15.00
    },
    {
      id: 5,
      name: "Night Repair Oil",
      image: "https://www.aroha-oils.com/cdn/shop/products/herophoto_1_d6f00682-401c-499f-8633-b4870b785b3a_300x.jpg?v=1650620273",
      desc: "Revitalizes skin overnight for a fresh look.",
      price: 45.00
    },
    {
      id: 6,
      name: "Exfoliating Scrub",
      image: "https://5.imimg.com/data5/SELLER/Default/2024/3/396168160/JO/AG/HR/215279458/ayurvedic-sutra-nava-sutra-face-scrub.jpg",
      desc: "Removes dead skin cells for smooth texture.",
      price: 22.50
    },
    {
      id: 7,
      name: "Soothing Aloe Gel",
      image: "https://images-static.nykaa.com/media/catalog/product/a/8/a8e9553NYKVLST000009ab_bb2.jpg?tr=w-500",
      desc: "Calms irritated skin with natural aloe vera.",
      price: 18.75
    },
    {
      id: 8,
      name: "Anti-Aging Cream",
      image: "https://5.imimg.com/data5/ECOM/Default/2023/3/297058740/HS/VI/BB/159110959/nava-rose-infused-anti-ageing-cream-50gms-face-cream-anahata-30980987486383.jpg",
      desc: "Reduces wrinkles and fine lines effectively.",
      price: 55.00
    }
  ];

  const productsContainer = document.getElementById('productsContainer');
  const cartSidebar = document.getElementById('cartSidebar');
  const cartItemsContainer = document.getElementById('cartItems');
  const cartTotalContainer = document.getElementById('cartTotal');
  const cartCount = document.getElementById('cartCount');
  const cartLink = document.getElementById('cartLink');
  const closeCartBtn = document.getElementById('closeCartBtn');

  let cart = [];

  // Render product cards
  function renderProducts() {
    products.forEach(product => {
      const productDiv = document.createElement('div');
      productDiv.className = 'product';

      productDiv.innerHTML = `
        <img src="${product.image}" alt="${product.name}" />
        <div class="product-details">
          <div class="product-name">${product.name}</div>
          <div class="product-desc">${product.desc}</div>
          <div class="product-price">$${product.price.toFixed(2)}</div>
          <button class="add-to-cart-btn" data-id="${product.id}">Add to Cart</button>
        </div>
      `;

      productsContainer.appendChild(productDiv);
    });
  }

  // Render cart items
  function renderCart() {
    if (cart.length === 0) {
      cartItemsContainer.innerHTML = '<p>Your cart is empty.</p>';
      cartTotalContainer.textContent = '';
      cartCount.textContent = '0';
      return;
    }

    cartCount.textContent = cart.reduce((acc, item) => acc + item.quantity, 0);

    let total = 0;
    cartItemsContainer.innerHTML = '';

    cart.forEach(item => {
      total += item.price * item.quantity;

      const itemDiv = document.createElement('div');
      itemDiv.className = 'cart-item';

      itemDiv.innerHTML = `
        <img src="${item.image}" alt="${item.name}">
        <div class="cart-item-details">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-price">$${item.price.toFixed(2)} x ${item.quantity}</div>
        </div>
        <div class="cart-item-remove" data-id="${item.id}" title="Remove item">&times;</div>
      `;

      cartItemsContainer.appendChild(itemDiv);
    });

    cartTotalContainer.textContent = `Total: $${total.toFixed(2)}`;
  }

  // Add item to cart
  function addToCart(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;

    const existing = cart.find(item => item.id === id);
    if (existing) {
      existing.quantity++;
    } else {
      cart.push({...product, quantity: 1});
    }
    renderCart();
  }

  // Remove item from cart
  function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    renderCart();
  }

  // Event listeners
  productsContainer.addEventListener('click', e => {
    if (e.target.classList.contains('add-to-cart-btn')) {
      const id = parseInt(e.target.getAttribute('data-id'));
      addToCart(id);
    }
  });

  cartItemsContainer.addEventListener('click', e => {
    if (e.target.classList.contains('cart-item-remove')) {
      const id = parseInt(e.target.getAttribute('data-id'));
      removeFromCart(id);
    }
  });

  cartLink.addEventListener('click', e => {
    e.preventDefault();
    toggleCart();
  });

  closeCartBtn.addEventListener('click', () => {
    closeCart();
  });

  // Show/hide cart sidebar
  function toggleCart() {
    if (cartSidebar.classList.contains('open')) {
      closeCart();
    } else {
      openCart();
    }
  }
  function openCart() {
    cartSidebar.classList.add('open');
    cartSidebar.setAttribute('aria-hidden', 'false');
  }
  function closeCart() {
    cartSidebar.classList.remove('open');
    cartSidebar.setAttribute('aria-hidden', 'true');
  }

  // About and Home link alerts for demo (replace with actual navigation)
  document.getElementById('aboutLink').addEventListener('click', e => {
    e.preventDefault();
    alert("Welcome to GlowSkin! We offer the best skincare products tailored to your needs.");
  });
  document.getElementById('homeLink').addEventListener('click', e => {
    e.preventDefault();
    window.scrollTo({top: 0, behavior: 'smooth'});
  });

  // Initial render
  renderProducts();
  renderCart();
</script>

</body>
</html>
